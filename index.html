<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Force a fresh load on first visit by redirecting to a cache-busted URL.
  // Subsequent reloads keep the same ?v= so the back button etc. behave normally.
  if (!new URLSearchParams(location.search).has('v')) {
    location.replace(location.pathname + '?v=' + Date.now() + location.hash);
  }
</script>
<title>Scavenger Hunts</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14121a;
    --text: #f4eedb;
    --muted: #9a8f7e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #1f1a2e 0%, #0a0814 60%);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    min-height: 100vh;
  }

  header { text-align: center; margin-bottom: 48px; max-width: 600px; }
  header .eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(40px, 7vw, 64px);
    line-height: 1.1;
    margin-bottom: 16px;
  }
  header h1 em { color: #ffd86b; font-style: italic; }
  header p { color: var(--muted); font-size: 16px; line-height: 1.6; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    width: 100%;
    max-width: 820px;
  }

  .card {
    position: relative;
    display: block;
    text-decoration: none;
    color: inherit;
    border-radius: 12px;
    padding: 36px 28px 32px;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    min-height: 280px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
  .card:focus-visible { outline: 2px solid #ffd86b; outline-offset: 4px; }

  .card-tag {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0.85;
  }
  .card-title {
    font-size: 36px;
    line-height: 1.05;
    margin-bottom: 8px;
  }
  .card-sub { font-size: 14px; opacity: 0.8; margin-bottom: 24px; }
  .card-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    align-self: flex-start;
    padding: 10px 18px;
    border-radius: 999px;
    transition: gap 0.2s ease;
  }
  .card:hover .card-cta { gap: 16px; }

  /* Brussels: neon arcade */
  .card.brussels {
    background: linear-gradient(135deg, #150040 0%, #0d0028 100%);
    border: 1px solid rgba(0, 207, 255, 0.25);
  }
  .card.brussels .card-tag { color: #00CFFF; font-family: 'Press Start 2P', monospace; font-size: 9px; }
  .card.brussels .card-title { font-family: 'Press Start 2P', monospace; font-size: 22px; color: #FFE033; text-shadow: 0 0 12px rgba(255, 224, 51, 0.6); }
  .card.brussels .card-sub { color: #bb99ee; }
  .card.brussels .card-cta { background: rgba(255, 45, 175, 0.15); color: #FF2DAF; border: 1px solid rgba(255, 45, 175, 0.4); font-family: 'Press Start 2P', monospace; font-size: 10px; }

  /* Dresden: gold elegance */
  .card.dresden {
    background: linear-gradient(135deg, #2c1f0e 0%, #1a1209 100%);
    border: 1px solid rgba(200, 151, 58, 0.3);
  }
  .card.dresden .card-tag { color: #c8973a; }
  .card.dresden .card-title { font-family: 'Playfair Display', serif; font-style: italic; color: #faf3e0; }
  .card.dresden .card-title em { color: #e8b84b; }
  .card.dresden .card-sub { color: #a89678; }
  .card.dresden .card-cta { background: rgba(200, 151, 58, 0.12); color: #e8b84b; border: 1px solid rgba(200, 151, 58, 0.4); }

  footer { margin-top: 48px; color: var(--muted); font-size: 12px; letter-spacing: 1px; }
</style>
</head>
<body>
  <header>
    <div class="eyebrow">Choose your adventure</div>
    <h1>Scavenger <em>Hunts</em></h1>
    <p>Two city quests for the family. Tap a card to begin.</p>
  </header>

  <main class="cards">
    <a class="card brussels" href="brussels.html">
      <div>
        <div class="card-tag">&gt; LOAD CITY_01</div>
        <div class="card-title">BRUSSELS</div>
        <div class="card-sub">Neon-lit family quest through the Belgian capital.</div>
      </div>
      <span class="card-cta">START &rarr;</span>
    </a>

    <a class="card dresden" href="dresden.html">
      <div>
        <div class="card-tag">Old Town &middot; Saxony</div>
        <div class="card-title">Dresden <em>Altstadt</em></div>
        <div class="card-sub">A walking hunt through Dresden's historic heart.</div>
      </div>
      <span class="card-cta">Begin the hunt &rarr;</span>
    </a>
  </main>

  <footer>Have fun out there.</footer>

  <script>
    // Append a cache-buster to the hunt links so clicking through always
    // fetches a fresh copy, even if the browser cached the hunt HTML.
    const v = Date.now();
    for (const a of document.querySelectorAll('a.card')) {
      const u = new URL(a.href);
      u.searchParams.set('v', v);
      a.href = u.toString();
    }
  </script>
</body>
</html>
